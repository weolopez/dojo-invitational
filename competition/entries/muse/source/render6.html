<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const out = document.getElementById('out');
try {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(1920, 1920);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  // bind height 1.88 m (validator), fighting_idle stands at the origin,
  // feet at y=0, facing +Z (all confirmed visually in three.js).
  const center = new THREE.Vector3(0, 0.94, 0);
  const size = new THREE.Vector3(1.2, 1.85, 0.6);
  const bb = { min: new THREE.Vector3(-0.6, 0, -0.3), max: new THREE.Vector3(0.6, 1.85, 0.3) };
  const key = new THREE.DirectionalLight(0xfff1dd, 2.4); key.position.set(center.x - 2.5, center.y + 3.5, center.z + 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0xbcd2ff, 1.1); rim.position.set(center.x + 2.5, center.y + 2, center.z - 3); scene.add(rim);

    new THREE.MeshStandardMaterial({ color: 0x14120e, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(center.x, 0, center.z); scene.add(ground);
  const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 100); scene.add(cam);
  const F = new THREE.Vector3(0, 0, 1);
  const rotY = (v, deg) => v.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(deg));
  const headT = new THREE.Vector3(center.x, bb.max.y - size.y * 0.13, center.z);
  const VIEWS = {
    front:         { dir: F,            target: center, fitH: size.y * 1.18 },
    three_quarter: { dir: rotY(F, 38),  target: center, fitH: size.y * 1.18 },
    profile:       { dir: rotY(F, 90),  target: center, fitH: size.y * 1.18 },
    closeup:       { dir: rotY(F, 16),  target: headT,  fitH: size.y * 0.34 },

  window.__view = (name) => {
    const v = VIEWS[name];

    cam.lookAt(v.target);
    renderer.render(scene, cam);
    return true;
  };
  out.textContent = 'READY fixed-frame h=1.85';

</script></body></html>
