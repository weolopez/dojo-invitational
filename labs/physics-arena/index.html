<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Dojo — physics animation demo</title>
<style>
  html, body { margin: 0; padding: 0; background: #14120e; overflow: hidden; height: 100%;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8e2d4; }
  canvas { display: block; }
  #hud { position: fixed; top: 16px; left: 16px; z-index: 10; max-width: 340px;
    background: rgba(20,18,14,.82); border: 1px solid rgba(232,226,212,.16); border-radius: 12px;
    padding: 14px 16px; backdrop-filter: blur(6px); }
  #hud h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  #hud .sub { font-size: 11.5px; color: #b7ae99; margin-bottom: 10px; line-height: 1.45; }
  #state { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    padding: 3px 8px; border-radius: 99px; background: #3d3423; color: #ffd98a; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  button { appearance: none; border: 1px solid rgba(232,226,212,.25); background: #262218;
    color: #e8e2d4; font-size: 12.5px; padding: 7px 11px; border-radius: 8px; cursor: pointer; }
  button:hover:not(:disabled) { background: #37301f; }
  button:disabled { opacity: .38; cursor: default; }
  button.warn { border-color: rgba(255,150,120,.45); }
  #note { font-size: 11px; color: #97907d; line-height: 1.5; margin-top: 8px; }
  #err { position: fixed; inset: auto 16px 16px 16px; z-index: 20; color: #ffb4a2; font-size: 12.5px;
    background: rgba(60,20,12,.85); border-radius: 8px; padding: 10px 12px; display: none; }
</style>
</head>
<body>
<div id="hud">
  <h1>Next Dojo — physics animation demo</h1>
  <div class="sub">One connected system: clips &rarr; physics fall &rarr; settled ragdoll &rarr; get-up &rarr; clips.
    Drag to orbit, wheel to zoom.</div>
  <div id="state">LOADING</div>
  <div class="row">
    <button id="bJab">Jab</button>
    <button id="bCross">Cross</button>
    <button id="bHook">Hook</button>
    <button id="bTaunt">Taunt</button>
  </div>
  <div class="row">
    <button id="bFallBack" class="warn">Uppercut &mdash; fall back</button>
    <button id="bFallSide" class="warn">Roundhouse &mdash; fall sideways</button>
  </div>
  <div class="row">
    <button id="bGetUp" disabled>Get up</button>
    <button id="bReset">Reset</button>
  </div>
  <div id="note">Fighter: Kachujin (Muse's Dojo Invitational entry). Physics: Rapier.
    v1 simplifications are listed in the README on the branch.</div>
</div>
<div id="err"></div>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/",
  "rapier": "./vendor/rapier.es.js"
} }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
