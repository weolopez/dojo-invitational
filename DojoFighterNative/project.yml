name: DojoFighter
options:
  bundleIdPrefix: com.weo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  DojoFighter:
    type: application
    platform: macOS
    sources:
      - path: DojoFighter
        excludes:
          - Resources/Info.plist
    resources:
      - path: DojoFighter/Resources/Models
        optional: true
      - path: DojoFighter/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weo.DojoFighter
        INFOPLIST_FILE: DojoFighter/Resources/Info.plist
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
